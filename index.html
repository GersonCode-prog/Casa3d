<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casa 3D · Diseña tu casa</title>
  <meta name="description" content="Diseña tu casa en 3D: dibuja paredes y habitaciones, agrega puertas, ventanas, pisos y muebles, y recórrela en primera persona.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15 16 5l12 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 13v13h17V13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><rect x="13.5" y="18" width="5" height="8" rx="1" fill="currentColor"/></svg>
      <div><b>Casa 3D</b><span>Diseña tu casa</span></div>
    </div>

    <div class="seg" id="views" role="tablist">
      <button data-view="3d" class="on">3D</button>
      <button data-view="plan">Plano 2D</button>
      <button data-view="walk">Recorrer</button>
    </div>

    <div class="actions">
      <button class="ib" data-act="undo" title="Deshacer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="ib" data-act="redo" title="Rehacer (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <span class="sep"></span>
      <button class="ib on" data-act="cut" title="Paredes cortadas (ver adentro)"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 20v-7h4v7M15 20v-7h4v7"/><path d="M5 9h4M15 9h4" stroke-dasharray="2 2"/></svg></button>
      <button class="ib on" data-act="grid" title="Cuadrícula (G)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
      <button class="ib on" data-act="day" title="Día / noche"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <span class="sep"></span>
      <div class="menu">
        <button class="btn" data-act="menu" title="Archivo"><span class="lbl-t">Archivo</span> <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="dropdown" id="filemenu" hidden>
          <button data-act="new">Nuevo diseño vacío</button>
          <button data-act="example">Cargar casa de ejemplo</button>
          <hr>
          <button data-act="export">Exportar diseño (.json)</button>
          <button data-act="import">Importar diseño (.json)</button>
          <hr>
          <button data-act="shot">Guardar captura (.png)</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="tools" aria-label="Herramientas">
    <button data-tool="select" class="on" title="Seleccionar y mover (1 / V)"><svg viewBox="0 0 24 24"><path d="m5 3 14 7-6 2-2 6z"/></svg><span>Mover</span></button>
    <button data-tool="wall" title="Pared (2)"><svg viewBox="0 0 24 24"><path d="M4 18 10 6h4l6 12"/><circle cx="4" cy="18" r="1.6"/><circle cx="20" cy="18" r="1.6"/></svg><span>Pared</span></button>
    <button data-tool="room" title="Habitación (3)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 12h6"/></svg><span>Cuarto</span></button>
    <button data-tool="floor" title="Piso (4)"><svg viewBox="0 0 24 24"><path d="M3 16 12 20l9-4-9-4z"/><path d="M7.5 14l9 4M16.5 14l-9 4"/></svg><span>Piso</span></button>
    <button data-tool="door" title="Puerta (5)"><svg viewBox="0 0 24 24"><path d="M6 21V4h12v17"/><path d="M3 21h18"/><circle cx="15" cy="13" r="1"/></svg><span>Puerta</span></button>
    <button data-tool="window" title="Ventana (6)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16M4 12h16"/></svg><span>Ventana</span></button>
    <span class="tsep"></span>
    <button data-act="catalog" class="on" title="Catálogo de muebles"><svg viewBox="0 0 24 24"><path d="M4 12V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M3 12h18v5H3z"/><path d="M5 17v2M19 17v2"/></svg><span>Muebles</span></button>
  </nav>

  <aside class="catalog" id="catalog">
    <div class="cat-head">
      <h2>Catálogo</h2>
      <input id="search" type="search" placeholder="Buscar mueble…" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <div class="cards" id="cards"></div>
  </aside>

  <main id="viewport">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <aside class="props" id="props" hidden></aside>
    <div id="walk" class="walk" hidden>
      <div class="walk-card">
        <h2>Recorre tu casa</h2>
        <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o flechas para caminar · mouse para mirar · <kbd>Shift</kbd> para correr · <kbd>Esc</kbd> para pausar</p>
        <div class="row">
          <button class="btn primary" data-act="walk-start">Comenzar</button>
          <button class="btn" data-act="walk-exit">Salir</button>
        </div>
      </div>
    </div>
    <div class="crosshair" hidden></div>
    <div class="dpad" hidden>
      <button data-key="KeyW">▲</button><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button>
    </div>
    <button class="walk-exit btn" data-act="walk-exit" hidden>Salir del recorrido</button>
  </main>

  <footer class="status">
    <span id="hint"></span>
    <span id="stats"></span>
  </footer>
</div>
<div id="measure"></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script type="module" src="src/app.js"></script>
</body>
</html>
